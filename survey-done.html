<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>提交成功 · 椰椰工坊意见征集</title>
    <script src="suggest-config.js?v=ad83ae3101"></script>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #161616;
        --paper: #f4f4f1;
        --panel: #ffffff;
        --rule: #d9d9d6;
        --signal: #fffa00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ededed;
          --paper: #161616;
          --panel: #222222;
          --rule: #353535;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main {
        width: min(34rem, 100%);
        padding: 2rem 1.6rem;
        border: 1px solid var(--ink);
        background: var(--panel);
        box-shadow: 6px 6px 0 var(--signal);
      }
      .eyebrow {
        display: inline-block;
        margin-bottom: 0.9rem;
        padding: 0.15rem 0.45rem;
        background: var(--ink);
        color: var(--panel);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 0.7rem; font-size: 1.6rem; }
      p { margin: 0 0 1.2rem; line-height: 1.8; color: var(--ink); opacity: 0.82; }
      a {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--ink);
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: var(--ink); color: var(--panel); }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Submitted</span>
      <h1>提交成功</h1>
      <p>感谢你的建议。问卷已在本机隐藏 30 天；审核通过后会显示在公示表中。</p>
      <a href="index.html#suggest">返回意见征集 →</a>
    </main>
    <script>
      (function () {
        var cfg = window.EF_SUGGEST_CONFIG || {};
        var key = cfg.submitKey || 'ef_suggest_submitted_at';
        var msg = cfg.submitMessage || 'ef-suggest-submitted';
        try { localStorage.setItem(key, String(Date.now())); } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: msg }, window.location.origin);
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
